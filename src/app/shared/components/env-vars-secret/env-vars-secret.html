<div class="container mt-4">
  <h4>Variables de entorno Secret</h4>

  <div class="table-responsive">
    <table class="table table-bordered text-center align-middle">
      <thead class="table-light">
        <tr>
          <th>Nombre</th>
          <th>Valor</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let variable of variablesSecrets; let i = index">
          <td class="p-2">
            <input type="text" class="form-control" (ngModelChange)="emitir()" [(ngModel)]="variable.nameDeploy" placeholder="NOMBRE_VAR" />
          </td>
          <td class="p-2">
            <input type="text" class="form-control mb-2" (ngModelChange)="emitir()" [(ngModel)]="variable.nameSecret" placeholder="Nombre del ConfigMap" />
            <input type="text" class="form-control" (ngModelChange)="emitir()" [(ngModel)]="variable.key" placeholder="valor" /></td>
          <td>
            <button class="btn btn-danger btn-sm" (click)="removeVariable(i)" *ngIf="variablesSecrets.length > 1">
              <i class="bi bi-trash-fill"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex gap-2">
    <button class="btn btn-outline-primary" (click)="addVariable()" >+ Añadir variable</button>
  </div>
</div>
