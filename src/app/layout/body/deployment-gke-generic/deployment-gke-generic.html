<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h2>Deployment GKE generico (bussines - journey - gateway)</h2>
      <p class="text-muted mb-0">Manage configuration variables, secrets, and environment settings</p>
    </div>
    <button class="btn btn-success" (click)="save()">Guardar</button>
  </div>

  <div class="row mb-3">
    <div class="col-md-4">
      <input type="text" class="form-control" placeholder="Name Artifact" [(ngModel)]="artifact"/>
    </div>
    <div class="col-md-3">
      <input type="text" class="form-control" placeholder="Namespace" [(ngModel)]="namespace"/>
    </div>
    <div class="col-md-3">
      <input type="number" class="form-control" id="inputCantidad" placeholder="Ingrese cantidad de Replicas" [(ngModel)]="replicas"/>
    </div>
  </div>
</div>
<app-env-vars (variablesChange)="recibirVariables($event)"></app-env-vars>
<app-env-vars-config
  (variablesChange)="recibirConfigMap($event)"
></app-env-vars-config>
<app-env-vars-secret
  (variablesChange)="recibirSecrets($event)"
></app-env-vars-secret>
